name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**

jobs:
  quality-gate:
    name: Quality Gate (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-version: 18.3.1
            types-react-version: 18.3.12
            types-react-dom-version: 18.3.5
          - react-version: 19.0.0
            types-react-version: 19.0.0
            types-react-dom-version: 19.0.0
          - react-version: 19.2.4
            types-react-version: 19.2.14
            types-react-dom-version: 19.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use React ${{ matrix.react-version }}
        run: |
          npm install --no-save --package-lock=false \
            react@${{ matrix.react-version }} \
            react-dom@${{ matrix.react-version }} \
            @types/react@${{ matrix.types-react-version }} \
            @types/react-dom@${{ matrix.types-react-dom-version }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run demo:build

      - name: Validate package
        run: npm run publint
